# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: greenhouse
  friendly_name: Greenhouse

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "U4mvTvwESMOMyf0tvGYK4L3Q8FLaaz5fYCE2Y3bl9kc="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Greenhouse Fallback Hotspot
    password: "8dWrvLzfoi8S"

captive_portal:


spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23  
  miso_pin: GPIO19


mcp3008:
  cs_pin: GPIO5
  id: my_mcp

sensor:
  - platform: mcp3008             # Attached to pin 0 of the MCP3008.
    reference_voltage: 3.3
    update_interval: 1h
    mcp3008_id: my_mcp
    id: channel_0
    number: 0                     # MCP3008 pin number
    name: Channel 0
    filters:
      # Convert voltage range (e.g., 2.32V to 3.46V) to a percentage (0% to 100%)
      - calibrate_linear:
          - 2.22 -> 0.0
          - 0.9 -> 100.0
    unit_of_measurement: "%"
    accuracy_decimals: 1

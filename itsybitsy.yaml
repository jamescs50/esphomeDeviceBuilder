esphome:
  name: office_air
  friendly_name: Office Air Quality

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  
# Enable Home Assistant API
api:
  encryption:
    key: "lpzkQBhQxq6pkEeHFnULL9D2xb/knrZCsmhpoEE5z3M="

ota:
  - platform: esphome
    password: "544460a705089fb30e1068aab89d369f"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "office_air Fallback Hotspot"
    password: !secret fallback_password

    

i2c:
  sda: 15
  scl: 27
  scan: true
  id: bus_0
  frequency: 800kHz
  timeout: 10ms

sensor:
  - platform: bme280_i2c
    temperature:
      name: "BME280 Temperature"
    pressure:
      name: "BME280 Pressure"
    humidity:
      name: "BME280 Humidity"    
  - platform: sgp30
    eco2:
      name: "eCO2"
    tvoc:
      name: "TVOC"
esphome:
  name: corner-light
  friendly_name: Corner Light

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "ev9v2hz+bsvdM1bJzrn5wVZ1kwxZgv6r3u1ur6h9Oz8="

ota:
  - platform: esphome
    password: "242cf6c13faf20dd8aab13bd5cb5a027"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Corner-Light Fallback Hotspot
    password: !secret fallback_password
binary_sensor:
  - platform: esp32_touch
    id: esp32_touch_pad
    pin: GPIOXX
    threshold: 0

sensor:
  - platform: template
    name: "Raw touch value"
    lambda: |-
        return id(esp32_touch_pad).get_value();
    update_interval: 3s

output:
  - platform: gpio
    pin: GPIO4
    id: relay_1

light:
  - platform: binary
    name: Light
    id: light_1
    output: relay_1

status_led:
  pin:
    number: GPIO6
    inverted: yes  
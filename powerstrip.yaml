# Board: Generic - BK7231N (Tuya QFN32)
# Definition: definitions/boards/generic-bk7231n-qfn32-tuya/manifest.yaml

esphome:
  name: powerstrip
  friendly_name: Powerstrip

bk72xx:
  board: cbu

logger:
  level: INFO

api:
  encryption:
    key: "0cbxatx0h8gorpFd/K6pDmAgW/+GerbqQWhovqEcnHI="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Powerstrip Fallback Hotspot
    password: !secret fallback_password

captive_portal:

# --- Replace the pins below with your real ones ---
switch:
  - platform: gpio
    name: "Socket 1"
    id: relay1
    pin: P6
  - platform: gpio
    name: "Socket 2"
    id: relay2
    pin: P7
  - platform: gpio
    name: "Socket 3"
    id: relay3
    pin: P8
  - platform: gpio
    name: "Socket 4"
    id: relay4
    pin: P9
  - platform: gpio
    name: "USB Socket"
    id: relay5
    pin: P26
    restore_mode: ALWAYS_ON


binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: P22
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay1
      - switch.toggle: relay2
      - switch.toggle: relay3
      - switch.toggle: relay4

      
status_led:
  pin:
    number: P20
    inverted: true


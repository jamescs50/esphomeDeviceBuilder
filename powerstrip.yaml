# Board: Generic - BK7231N (Tuya QFN32)
# Definition: definitions/boards/generic-bk7231n-qfn32-tuya/manifest.yaml

esphome:
  name: powerstrip
  friendly_name: Powerstrip

bk72xx:
  board: cbu

logger:
  level: INFO

api:
  encryption:
    key: "0cbxatx0h8gorpFd/K6pDmAgW/+GerbqQWhovqEcnHI="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Powerstrip Fallback Hotspot
    password: !secret fallback_password

captive_portal:

# --- Replace the pins below with your real ones ---
switch:
  - platform: gpio
    name: "Socket 1"
    id: relay1
    pin: P6
  - platform: gpio
    name: "Socket 2"
    id: relay2
    pin: P7
  - platform: gpio
    name: "Socket 3"
    id: relay3
    pin: P8
#  - platform: gpio
#    name: "Socket 4"
#    id: relay4
#    pin: P22
  - platform: gpio
    name: "USB Socket"
    id: relay5
    pin: P26
  - platform: gpio
    name: "Test 1"
    id: test1
    pin: P28
  - platform: gpio
    name: "Test 2"
    id: rtest2
    pin: P10
  - platform: gpio
    name: "Test 3"
    id: test3
    pin: P11
  - platform: gpio
    name: "Test 4"
    id: test4
    pin: P1

#not 23,  24   P22

binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: P14  #not P9 or P28 P17 P15
      mode: INPUT_PULLUP
      inverted: true
#    on_press:
#      - switch.toggle: relay1
  - platform: gpio
    name: "Button2"
    pin:
      number: P16  
      mode: INPUT_PULLUP
      inverted: true
  - platform: gpio
    name: "Button3"
    pin:
      number: P20  #not P9 or P28 P17
      mode: INPUT_PULLUP
      inverted: true
  - platform: gpio
    name: "Button4"
    pin:
      number: P22  #not P9 or P28 P17
      mode: INPUT_PULLUP
      inverted: true

      
#status_led:

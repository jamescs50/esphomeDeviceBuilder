# Board: Generic - BK7231N (Tuya QFN32)
# Definition: definitions/boards/generic-bk7231n-qfn32-tuya/manifest.yaml

esphome:
  name: powerstrip
  friendly_name: Powerstrip

bk72xx:
  board: cbu

logger:
  level: INFO

api:
  encryption:
    key: "0cbxatx0h8gorpFd/K6pDmAgW/+GerbqQWhovqEcnHI="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Powerstrip Fallback Hotspot
    password: !secret fallback_password

captive_portal:

# --- Replace the pins below with your real ones ---
switch:
  - platform: gpio
    name: "Socket 1"
    id: relay1
    pin: P6
  - platform: gpio
    name: "Socket 2"
    id: relay2
    pin: P7
  - platform: gpio
    name: "Socket 3"
    id: relay3
    pin: P8
  - platform: gpio
    name: "Socket 4"
    id: relay4
    pin: P9
  - platform: gpio
    name: "USB Socket"
    id: relay5
    pin: P26

#not 23,  24   P22, P26, 28, 10, 11, 1, 14, 16, 20, 15

binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: P22
      mode: INPUT_PULLUP
      inverted: true
#    on_press:
#      - switch.toggle: relay1

      

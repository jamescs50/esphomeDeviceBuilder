# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: 4relays-test
  friendly_name: 4Relays Test

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "Y58R4YzTc79ZSQagg20cKHcfDSJMBUqtqTMzN09NqMU="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: 4Relays Test Fallback Hotspot
    password: !secret fallback_password

    
  use_address: 10.6.5.132
output:
  - platform: gpio
    pin: GPIO26
    id: relay_1
  - platform: gpio
    pin: GPIO27
    id: relay_2
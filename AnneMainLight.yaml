esphome:
  name: anne-main-light
  friendly_name: Anne Main Light


esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "jDm86dgk/74M9Yspb6iG42jVIeohMNWyxmfUcXAndBA="

ota:
  - platform: esphome
    password: "6fc19af697517435ef435626897a727d"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Office-Main-Light"
    password: "ACWd6K2ksvE9"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    id: button_1
    on_press:
      then:
        - light.toggle: light_1

  - platform: status
    name: "T1 Status"

output:
  - platform: gpio
    pin: GPIO12
    id: relay_1

light:
  - platform: binary
    name: "Light 1"
    id: light_1
    output: relay_1

status_led:
  pin:
    number: GPIO13
    inverted: yes    
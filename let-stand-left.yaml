esphome:
  name: let-stand-left
  friendly_name: LED Stand Left

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "lsfOlGQWCAJGxOc7LGrPgV2TZqwmkepaXNfHc6VNcxk="

ota:
  - platform: esphome
    password: "a1dcf9742444d486e2ae1b8c4edd0e72"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Led-Stand-Left Fallback Hotspot"
    password: !secret fallback_password

captive_portal:
    
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    id: button_1
    on_press:
      then:
        - light.toggle: light_1

output:
  - platform: gpio
    pin: GPIO4
    id: relay_1

light:
  - platform: binary
    name: Light
    id: light_1
    output: relay_1

status_led:
  pin:
    number: GPIO6
    inverted: yes  
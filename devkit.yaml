#    id: my_switch
#    pin: GPIO17
    
light:
  - platform: binary
    name: Binary Light
    id: light_binary_1
    output: led_output
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO33
    num_leds: 30
    chipset: ws2812
    name: "My Light"


output:
  - platform: gpio
    id: led_output
    pin: GPIO5


binary_sensor:
  - platform: gpio
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: false
      inverted: true
    id: button_1
    name: pad
    on_press:
      then:
        - light.toggle: light_binary_1





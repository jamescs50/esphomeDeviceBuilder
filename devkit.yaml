# Board: ESP32 DevKit V1 (Espressif)
# Definition: definitions/boards/esp32-devkit-v1/manifest.yaml

esphome:
  name: devkit
  friendly_name: DevKit

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "cmrlO76bqF3t+4MlGBKfYk947nVIuE5+5yvh4iWMZ50="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: DevKit Fallback Hotspot
    password: "vY4lSYY9Swg6"

captive_portal:

